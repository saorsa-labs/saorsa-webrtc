[package]
name = "saorsa-webrtc-core"
version.workspace = true
edition = "2021"
authors = ["Saorsa Labs Limited <saorsalabs@gmail.com>", "David Irvine <david@maidsafe.com>"]
license = "AGPL-3.0"
homepage = "https://github.com/dirvine/saorsa-webrtc"
repository = "https://github.com/dirvine/saorsa-webrtc"
description = "Core WebRTC implementation over ant-quic transport"

[features]
# QUIC-native transport (default) - uses ant-quic for all media
quic-native = []

# Legacy WebRTC support (optional) - includes traditional webrtc crate
# Allows fallback to ICE/DTLS/SRTP for compatibility. The `webrtc` crate
# re-exports the ice/dtls/srtp/media sub-crates we use; direct deps on the
# sub-crates were unused and removed (WP-V0.4).
legacy-webrtc = ["dep:webrtc"]

# Test utilities feature
test-utils = []

# Default features: Include legacy-webrtc support (for compatibility)
# Phase 2 will allow omitting legacy-webrtc when QuicMediaTransport is ready
default = ["quic-native", "legacy-webrtc"]

[dependencies]
# Core async and serialization
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
bytes = "1.5"
chrono = { version = "0.4.38", features = ["serde"] }
postcard = { version = "1.1.3", features = ["use-std"] }

# Cryptography
rand = "0.8"

# Networking - ant-quic as primary transport (provides all transport types)
ant-quic = { workspace = true }

# WebRTC (gated by legacy-webrtc feature, included by default). The `webrtc`
# crate re-exports the sub-crates the legacy path touches.
webrtc = { version = "0.13", optional = true }

# Codec support (new)
saorsa-webrtc-codecs = { version = "0.4.0", path = "../saorsa-webrtc-codecs" }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[package.metadata.cargo-machete]
# workspace-hack is hakari's build-unification crate — intentionally "unused".
ignored = ["workspace-hack"]

[dev-dependencies]
tempfile = "3.10"
pretty_assertions = "1.4"
serial_test = "3.1"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tokio-test = "0.4"
rand = "0.8"
